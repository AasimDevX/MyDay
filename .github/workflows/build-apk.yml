name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Detect active Java major version
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Version output: $JAVA_VERSION_OUTPUT"
          
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Active Java major version could not be detected."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR (>= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists. Reusing existing debug keystore."
          fi
          
          if [ ! -f ./debug.keystore ]; then
            echo "Error: ./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Expected debug APK is missing at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Error: The expected debug APK ($EXPECTED_APK) does not exist."
            exit 1
          fi
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac
          
          echo "Verified exact debug APK: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TEMP_DIR"
          
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F/ '{print $2}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')
          
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          echo "asset_path=${ASSET_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_FILENAME}" >> $GITHUB_OUTPUT
          echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $ASSET_PATH ($ASSET_FILENAME)"
          echo "Constructed release tag: $TAG_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Prepared asset does not have .apk extension."
              exit 1
              ;;
          esac
          
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}
          
          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Workflow Run Number**: ${{ github.run_number }}
          - **Workflow Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: ${{ github.sha }}
          - **Intended Usage**: Testing and development verification
          - **Notice**: This APK is intended for testing and is not a Play Store production release.
          - **Signing**: Signed only with a temporary debug keystore.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $RELEASE_TAG and asset: $ASSET_PATH"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          echo "=== APK Build & Release Report ==="
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url || echo "")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was built and published to GitHub Releases."
              echo ""
              if [ -n "$RELEASE_URL" ]; then
                echo "**Download APK**: Direct access via GitHub Release: [${RELEASE_TAG}](${RELEASE_URL})"
              fi
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Asset Filename**: \`$ASSET_NAME\`"
              echo "- **Direct Download**: Available under the release **Assets** section."
              echo "- **Backup Artifact**: The standard GitHub Actions artifact \`app-debug-apk\` is also available under this workflow run."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The APK build and verification succeeded."
            echo "The GitHub Actions artifact named 'app-debug-apk' remains available for download."
            
            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "The debug APK was successfully built and verified."
              echo ""
              echo "> **Note**: Publishing directly to GitHub Releases did not succeed or was skipped."
              echo ""
              echo "- **Backup Download**: Download the APK from the GitHub Actions artifact: \`app-debug-apk\`."
            } >> $GITHUB_STEP_SUMMARY
          fi
